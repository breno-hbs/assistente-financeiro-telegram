spring.application.name=assistente-financeiro
server.port=8080

google.sheets.credentials-path=/home/ubuntu/credentials/google-service-account.json
google.sheets.spreadsheet-id=COLE_AQUI_O_ID_DA_PLANILHA
google.sheets.sheet-name=Acompanhamento


telegram.bot-token=COLE_AQUI_O_TOKEN_DO_BOTFATHER
telegram.webhook-secret=escolha-uma-senha-aqui
# Chat ids do Telegram que podem usar /saldo, /fatura e /posso (separados por vírgula)
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}

# Aba "Controle" (comandos /saldo, /fatura e /posso)
controle.sheet-name=Controle
controle.celula.saldo=F18
controle.celula.fatura=F19
controle.celula.dinheiro-livre=F22
controle.celula.disponivel-lazer=F23
controle.celula.posso-gastar=F24
