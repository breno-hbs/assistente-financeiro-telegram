# Configuração do Nginx pro Assistente Financeiro
# Copie esse arquivo pra /etc/nginx/sites-available/assistente-financeiro na VM

server {
    listen 443 ssl;
    server_name brenobot.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/brenobot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brenobot.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name brenobot.duckdns.org;
    # Redireciona qualquer tentativa em HTTP direto pra HTTPS
    return 301 https://$host$request_uri;
}
